<style>

.day-row .t{width:50px;flex:none;color:var(--muted)}.day-row.now{background:var(--accent-soft);margin-inline:-14px;padding-inline:14px}.day-row.rec{background:var(--warn-soft)}

.scroll{overflow-x:auto}table{border-collapse:collapse;min-width:560px;width:100%;font-size:.8rem}th,td{border:1px solid var(--line);padding:6px;text-align:center;vertical-align:top}th{background:var(--accent-soft)}td.now{background:var(--accent-soft)}td.ed{cursor:pointer}td.ed:hover{outline:2px solid var(--accent)}td b{display:block}td span{color:var(--muted)}
.subs{display:flex;flex-wrap:wrap;gap:8px}.subs label{display:flex;gap:6px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:.82rem}
.msg{padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--accent-text);font-size:.88rem}.msg.bad{background:var(--warn-soft);color:var(--warn)}
.login{margin-top:6vh}.login .logo{display:grid;justify-items:center;gap:6px;text-align:center}.login .logo img{height:84px;max-width:200px;object-fit:contain}.login .logo b{font:700 2.4rem var(--display);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:3px solid transparent;border-image:var(--grad) 1;display:grid;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav button{background:none;border:0;padding:8px 4px;border-radius:10px;cursor:pointer;display:grid;gap:2px;justify-items:center;font-size:.78rem;color:var(--muted);position:relative;font-weight:500}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}nav button.on{color:var(--accent-text);background:var(--accent-soft)}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--red);color:#fff;border-radius:99px;min-width:18px;height:18px;font-size:.7rem;display:grid;place-items:center;padding:0 4px;font-style:normal}

body{font-size:16px}.card{border-radius:18px}.btn{border-radius:12px;transition:transform .12s,box-shadow .12s}.btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(31,58,95,.18)}.btn:active{transform:none}.clock{border-radius:18px}.hello h1{font-size:1.6rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}.hello small{font-size:.95rem}@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover{transform:none}}.ferr{display:block;color:#b42318;font-size:.85rem;margin-top:2px}.bad{border-color:#b42318!important}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ferr{color:#ff9d97}}:root[data-theme="dark"] .ferr{color:#ff9d97}
.sbox{position:relative}.sbox span{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.sbox input{width:100%;padding:12px 14px 12px 42px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.sres{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(15,23,34,.18);z-index:20;max-height:60vh;overflow:auto;padding:6px}
.sres h4{margin:6px 10px;font:600 .74rem var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.sres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:10px;border-radius:10px;cursor:pointer;min-height:44px}
.sres button:hover,.sres button.act{background:var(--accent-soft)}.sres small{padding:6px 10px;display:block}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overflow-x:hidden}
.wrap{grid-template-columns:minmax(0,1fr)}
.wrap>*,main,.card,.row>*,.li>div{min-width:0}
.card,.li,.msg,small,b{overflow-wrap:anywhere}

.scroll{-webkit-overflow-scrolling:touch}
.dayseg{display:none;grid-template-columns:repeat(5,1fr);gap:6px}.dayseg .btn{padding:8px 0;min-width:0}
